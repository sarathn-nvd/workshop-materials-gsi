[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-app"
version = "0.1.0"
description = "AML Investigation Agent backend (NAT-based)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "nvidia-nat[langchain,phoenix,opentelemetry,profiler]>=1.5.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "rapidfuzz>=3.9",
  "networkx>=3.3",
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "openai>=1.50",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.entry-points."nat.components"]
register = "aml_app.register"

[tool.setuptools.packages.find]
where = ["."]
include = ["aml_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
