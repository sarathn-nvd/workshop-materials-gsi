# 4 replicas × TP=2, one replica per NVLink-bridged GPU pair.
# Topology (verified by `nvidia-smi topo -m`):
#   GPU 0+3  NV12  (NUMA 0)
#   GPU 1+2  NV12  (NUMA 0)
#   GPU 4+5  NV12  (NUMA 2)
#   GPU 6+7  NV12  (NUMA 2)
# All TP all-reduces stay inside an NVLink pair; cross-replica traffic
# (load-balancer fan-out only) is the only thing that crosses NUMA.
#
# All replicas share LOCAL_NIM_CACHE so the model weights are downloaded
# exactly once. gemma-0 is started first; the other replicas wait for it
# to be healthy and then mmap the same cached engine.

x-nim-base: &nim-base
  image: nvcr.io/nim/google/gemma-4-31b-it:${NIM_TAG:-1.7.0-variant}
  runtime: nvidia
  restart: unless-stopped
  shm_size: "32gb"
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  volumes:
    - ${LOCAL_NIM_CACHE:-./nim-cache}:/opt/nim/.cache
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
    interval: 30s
    timeout: 10s
    retries: 60
    start_period: 1200s

x-nim-env: &nim-env
  NGC_API_KEY: ${NGC_API_KEY}
  NIM_SERVER_PORT: "8000"
  NIM_TENSOR_PARALLEL_SIZE: "2"
  NIM_PIPELINE_PARALLEL_SIZE: "1"
  NIM_MAX_MODEL_LEN: "${NIM_MAX_MODEL_LEN:-32768}"
  NIM_MAX_NUM_SEQS: "${NIM_MAX_NUM_SEQS:-128}"
  NIM_KVCACHE_PERCENT: "${NIM_KVCACHE_PERCENT:-0.9}"
  NIM_ENABLE_KV_CACHE_REUSE: "1"
  NIM_SCHEDULER_POLICY: "max_utilization"
  NIM_SERVED_MODEL_NAME: "google/gemma-4-31b-it"
  NIM_LOG_LEVEL: "INFO"

services:
  gemma-0:
    <<: *nim-base
    container_name: gemma-4-31b-it-0
    cpuset: "0-29,120-149"
    environment:
      <<: *nim-env
      NVIDIA_VISIBLE_DEVICES: "0,3"

  gemma-1:
    <<: *nim-base
    container_name: gemma-4-31b-it-1
    cpuset: "0-29,120-149"
    environment:
      <<: *nim-env
      NVIDIA_VISIBLE_DEVICES: "1,2"
    depends_on:
      gemma-0:
        condition: service_healthy

  gemma-2:
    <<: *nim-base
    container_name: gemma-4-31b-it-2
    cpuset: "60-89,180-209"
    environment:
      <<: *nim-env
      NVIDIA_VISIBLE_DEVICES: "4,5"
    depends_on:
      gemma-0:
        condition: service_healthy

  gemma-3:
    <<: *nim-base
    container_name: gemma-4-31b-it-3
    cpuset: "60-89,180-209"
    environment:
      <<: *nim-env
      NVIDIA_VISIBLE_DEVICES: "6,7"
    depends_on:
      gemma-0:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    container_name: gemma-4-31b-it-lb
    restart: unless-stopped
    ports:
      - "${NIM_HOST_PORT:-8000}:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gemma-0:
        condition: service_healthy
      gemma-1:
        condition: service_healthy
      gemma-2:
        condition: service_healthy
      gemma-3:
        condition: service_healthy
    healthcheck:
      # nginx:alpine ships busybox `nc`; verify port 8000 is accepting connections.
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 30s
      timeout: 5s
      retries: 5
